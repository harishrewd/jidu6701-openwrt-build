workflow-name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Custom Model Auto-Detection via Files Overlay
      run: |
        # Define the exact destination folder structure in OpenWrt's custom files override directory
        OVERLAY_DIR="openwrt/files/etc/board.d"
        mkdir -p "$OVERLAY_DIR"
        BOARD_SCRIPT="$OVERLAY_DIR/01_system"
        
        # 1. Update the compile-time image definition string
        TARGET_FILE="openwrt/target/linux/mediatek/image/filogic.mk"
        if [ -f "$TARGET_FILE" ]; then
          sed -i 's/DEVICE_MODEL := JioRouter AX6000 JIDU6J01/DEVICE_MODEL := JioRouter AX6000 JIDU Series/g' "$TARGET_FILE"
          echo "✅ Compilation matrix set to generic Series tracking."
        fi
        
        # 2. Write the detection logic cleanly directly into our custom files overlay
        cat << 'EOF' > "$BOARD_SCRIPT"
        #!/bin/sh
        # Dynamic Jio Router Model Auto-Detection script for unified MediaTek profile
        . /lib/functions.sh
        . /lib/functions/system.sh
        
        jio_board_detect() {
        	local model
        	if [ -f /proc/device-tree/model ]; then
        		model=$(cat /proc/device-tree/model 2>/dev/null | tr -d "\0")
        	fi
        	case "$model" in
        		*JIDU6201*) model="JioRouter AX6000 JIDU6201" ;;
        		*JIDU6401*) model="JioRouter AX6000 JIDU6401" ;;
        		*JIDU6601*) model="JioRouter AX6000 JIDU6601" ;;
        		*JIDU6701*) model="JioRouter AX6000 JIDU6701" ;;
        		*JIDU6801*) model="JioRouter AX6000 JIDU6801" ;;
        		*) model="JioRouter AX6000 JIDU6701 (Auto-Detected)" ;;
        	esac
        	mkdir -p /tmp/sysinfo
        	echo "jiorouter_ax6000-jidu6j01" > /tmp/sysinfo/board_name
        	echo "$model" > /tmp/sysinfo/model
        }
        
        UCIDEV_BOOTSTEP=jio_board_detect
        EOF
        
        chmod +x "$BOARD_SCRIPT"
        echo "✅ Embedded hardware runtime lookup engine injected successfully into files/ overlay."

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        # Core Architecture Target Configuration for JioRouter
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        # Profile assignments mapping block
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        # Include baseline interface components
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
