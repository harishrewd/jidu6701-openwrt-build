name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/opewnrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Native Board Detection Matrix (For LuCI Sync)
      run: |
        BOARD_DIR="openwrt/files/etc/board.d"
        mkdir -p "$BOARD_DIR"
        NET_FILE="$BOARD_DIR/02_network"
        
        echo '#!/bin/sh' > "$NET_FILE"
        echo '# Native early platform configuration hook' >> "$NET_FILE"
        echo 'if [ -c "/dev/mtd6" ]; then' >> "$NET_FILE"
        echo '    DETECTED_MODEL=$(dd if=/dev/mtd6 bs=1k count=256 2>/dev/null | strings | grep -m 1 "device_model=" | cut -d'=' -f2 | tr -d '\''[:space:]'\'')' >> "$NET_FILE"
        echo '    if [ -n "$DETECTED_MODEL" ]; then' >> "$NET_FILE"
        echo '        mkdir -p /tmp/sysinfo' >> "$NET_FILE"
        echo '        echo "JioRouter AX6000 $DETECTED_MODEL" > /tmp/sysinfo/model' >> "$NET_FILE"
        echo '    fi' >> "$NET_FILE"
        echo 'fi' >> "$NET_FILE"
        
        chmod +x "$NET_FILE"
        echo "✅ LuCI web dashboard configuration matrix safely generated."

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Prepare Kernel Source Tree and Inject Early dmesg Modification
      run: |
        cd openwrt
        make target/linux/prepare
        MTD_CORE_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-* -name mtdcore.c | head -n 1)
        
        if [ -n "$MTD_CORE_FILE" ] && [ -f "$MTD_CORE_FILE" ]; then
            echo "Found Kernel Storage Driver Source: $MTD_CORE_FILE"
            
            # Generating the patch script cleanly using an array to prevent red visual editor lines
            echo "import sys" > patch_helper.py
            echo "target_file = sys.argv[1]" >> patch_helper.py
            echo "with open(target_file, 'r') as f: content = f.read()" >> patch_helper.py
            
            echo "lines = [" >> patch_helper.py
            echo "    '\tif (mtd->name && (strcmp(mtd->name, \"MFG\") == 0 || strcmp(mtd->name, \"mfg\") == 0)) {'," >> patch_helper.py
            echo "    '\t\tsize_t retlen;'," >> patch_helper.py
            echo "    '\t\tunsigned char *buf = kzalloc(4096, GFP_KERNEL);'," >> patch_helper.py
            echo "    '\t\tif (buf) {'," >> patch_helper.py
            echo "    '\t\t\tif (mtd_read(mtd, 0, 4096, &retlen, buf) == 0) {'," >> patch_helper.py
            echo "    '\t\t\t\tchar *match = strnstr((char *)buf, \"device_model=\", retlen);'," >> patch_helper.py
            echo "    '\t\t\t\tif (match) {'," >> patch_helper.py
            echo "    '\t\t\t\t\tchar model_val[32] = {0};'," >> patch_helper.py
            echo "    '\t\t\t\t\tchar final_name[64] = {0};'," >> patch_helper.py
            echo "    '\t\t\t\t\tif (sscanf(match, \"device_model=%31s\", model_val) == 1) {'," >> patch_helper.py
            echo "    '\t\t\t\t\t\tsnprintf(final_name, sizeof(final_name), \"JioRouter AX6000 %s\", model_val);'," >> patch_helper.py
            echo "    '\t\t\t\t\t\tpr_info(\"Setting dmesg designation to: %s\\\n\", final_name);'," >> patch_helper.py
            echo "    '\t\t\t\t\t}'," >> patch_helper.py
            echo "    '\t\t\t\t}'," >> patch_helper.py
            echo "    '\t\t\t}'," >> patch_helper.py
            echo "    '\t\t\tkfree(buf);'," >> patch_helper.py
            echo "    '\t\t}'," >> patch_helper.py
            echo "    '\t}'," >> patch_helper.py
            echo "    '',' >> patch_helper.py
            echo "    'fail_added:'" >> patch_helper.py
            echo "]" >> patch_helper.py
            
            echo "hook_code = '\n'.join(lines)" >> patch_helper.py
            echo "if 'fail_added:' in content and 'Setting dmesg designation' not in content:" >> patch_helper.py
            echo "    content = content.replace('fail_added:', hook_code)" >> patch_helper.py
            echo "    with open(target_file, 'w') as f: f.write(content)" >> patch_helper.py
            echo "    print('✅ Complete success.')" >> patch_helper.py
            
            python3 patch_helper.py "$MTD_CORE_FILE"
            rm patch_helper.py
        else
            echo "❌ Error: Could not locate kernel source target workspace."
            exit 1
        fi

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
