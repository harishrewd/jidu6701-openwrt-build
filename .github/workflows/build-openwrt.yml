name: Build OpenWrt for JioRouter JIDU6701 (25.12.6+)

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main # Pulls the active branch containing the 25.12 code merges

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Patch Model Target (Force JIDU6701 Name Mapping)
      run: |
        cd openwrt
        # Target the core MediaTek board architecture layout files
        TARGET_FILE="target/linux/mediatek/image/filogic.mk"
        BOARD_SCRIPT="target/linux/mediatek/filogic/base-files/etc/board.d/01_system"
        
        # 1. Patch the device image generation metadata block
        if [ -f "$TARGET_FILE" ]; then
          sed -i 's/DEVICE_MODEL := AX6000 JIDU6J01/DEVICE_MODEL := AX6000 JIDU6701/g' $TARGET_FILE
          echo "Image model definition metadata updated successfully."
        fi

        # 2. Patch the runtime initialization detection script so LuCI displays JIDU6701
        if [ -f "$BOARD_SCRIPT" ]; then
          sed -i 's/"*jiorouter,ax6000-jidu6j01*"/"*jiorouter,ax6000-jidu6j01*" | "*jiorouter,ax6000-jidu6701*"/g' $BOARD_SCRIPT
          sed -i 's/JioRouter AX6000 JIDU6J01/JioRouter AX6000 JIDU6701/g' $BOARD_SCRIPT
          echo "Runtime architecture mapping updated successfully."
        fi

    - name: Generate Custom Build Configuration (.config)
      run: |
        cd openwrt
        # Define core hardware target profiles safely
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000=y" >> .config
        
        # Expand core selections to populate dependency trees
        make defconfig
        
        # Force bundle standard LuCI web app tools safely
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # Finalize structural schema configuration
        make defconfig

    - name: Compile the Firmware
      run: |
        cd openwrt
        echo "Starting safe-mode compilation profile sequence..."
        # Compile the internal host utilities cleanly, then scale up thread count to process the system image
        FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s || FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s
        FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j1 V=s
        FORCE_UNSAFE_CONFIGURE=1 make -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make -j1 V=s

    - name: Upload Firmware to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_25.12.6_JIDU6701_Firmware
        path: openwrt/bin/**/*.bin
