name: Build OpenWrt for JioRouter JIDU6701 (25.12.6+)

on:
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main # Pulls the active branch containing the 25.12 code merges

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Patch Model Target (Force JIDU6701 as Primary Name)
      run: |
        cd openwrt
        TARGET_FILE="target/linux/mediatek/image/filogic.mk"
        
        if [ -f "$TARGET_FILE" ]; then
          # Modifies the definition titles so the build output shifts context strictly to JIDU6701
          sed -i 's/DEVICE_MODEL := AX6000 JIDU6J01/DEVICE_MODEL := AX6000 JIDU6701/g' $TARGET_FILE
          sed -i 's/JioRouter AX6000 JIDU6J01/JioRouter AX6000 JIDU6701/g' $TARGET_FILE
          echo "Target patch successfully applied to 25.12 codebase!"
        else
          echo "Error: Target config layout changed or file not found!" && exit 1
        fi

    - name: Generate Custom Build Configuration (.config)
      run: |
        cd openwrt
        # Define core targets first
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000=y" >> .config
        
        # Expand core selections to populate dependency trees
        make defconfig
        
        # Now force enable packages safely after tree expansion
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # Finalize schema structure validation
        make defconfig

    - name: Compile the Firmware
      run: |
        cd openwrt
        echo "Starting safe-mode toolchain compilation..."
        
        # 1. Build host tools safely using single-threading to eliminate deadlock container freezes
        FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s || FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s
        
        # 2. Build the toolchain using full system power
        FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j1 V=s
        
        # 3. Compile all packages and target firmware images using maximum threads
        FORCE_UNSAFE_CONFIGURE=1 make -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make -j1 V=s

    - name: Upload Firmware to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_25.12.6_JIDU6701_Firmware
        path: openwrt/bin/**/*.bin
