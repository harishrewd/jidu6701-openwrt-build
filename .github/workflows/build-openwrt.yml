name: Compile Clean Jio JIDU Auto-Detect Custom-Radio Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Dynamic Model Auto-Detection Code
      run: |
        TARGET_FILE="openwrt/target/linux/mediatek/image/filogic.mk"
        BOARD_SCRIPT="openwrt/target/linux/mediatek/filogic/base-files/etc/board.d/01_system"
        
        # 1. Update image generation build flags generically
        if [ -f "$TARGET_FILE" ]; then
          sed -i 's/DEVICE_MODEL := JioRouter AX6000 JIDU6J01/DEVICE_MODEL := JioRouter AX6000 JIDU Series/g' "$TARGET_FILE"
          echo "✅ Compilation matrix set to generic Series tracking."
        fi
        
        # 2. Safely generate the script file piece by piece using plain echo to completely avoid YAML syntax issues
        if [ -f "$BOARD_SCRIPT" ]; then
          echo '#!/bin/sh' > "$BOARD_SCRIPT"
          echo '# Dynamic Jio Router Model Auto-Detection script for unified MediaTek profile' >> "$BOARD_SCRIPT"
          echo '. /lib/functions.sh' >> "$BOARD_SCRIPT"
          echo '. /lib/functions/system.sh' >> "$BOARD_SCRIPT"
          echo 'jio_board_detect() {' >> "$BOARD_SCRIPT"
          echo '	local model' >> "$BOARD_SCRIPT"
          echo '	if [ -f /proc/device-tree/model ]; then' >> "$BOARD_SCRIPT"
          echo '		model=$(cat /proc/device-tree/model 2>/dev/null | tr -d "\0")' >> "$BOARD_SCRIPT"
          echo '	fi' >> "$BOARD_SCRIPT"
          echo '	case "$model" in' >> "$BOARD_SCRIPT"
          echo '		*JIDU6201*) model="JioRouter AX6000 JIDU6201" ;;' >> "$BOARD_SCRIPT"
          echo '		*JIDU6401*) model="JioRouter AX6000 JIDU6401" ;;' >> "$BOARD_SCRIPT"
          echo '		*JIDU6601*) model="JioRouter AX6000 JIDU6601" ;;' >> "$BOARD_SCRIPT"
          echo '		*JIDU6701*) model="JioRouter AX6000 JIDU6701" ;;' >> "$BOARD_SCRIPT"
          echo '		*JIDU6801*) model="JioRouter AX6000 JIDU6801" ;;' >> "$BOARD_SCRIPT"
          echo '		*) model="JioRouter AX6000 JIDU6701 (Auto-Detected)" ;;' >> "$BOARD_SCRIPT"
          echo '	esac' >> "$BOARD_SCRIPT"
          echo '	mkdir -p /tmp/sysinfo' >> "$BOARD_SCRIPT"
          echo '	echo "jiorouter_ax6000-jidu6j01" > /tmp/sysinfo/board_name' >> "$BOARD_SCRIPT"
          echo '	echo "$model" > /tmp/sysinfo/model' >> "$BOARD_SCRIPT"
          echo '}' >> "$BOARD_SCRIPT"
          echo 'UCIDEV_BOOTSTEP=jio_board_detect' >> "$BOARD_SCRIPT"
          
          chmod +x "$BOARD_SCRIPT"
          echo "✅ Embedded hardware runtime lookup engine injected successfully into 01_system."
        fi

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        # Core Architecture Target Configuration for JioRouter
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        # Profile assignments mapping block
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        # CRITICAL 40MHz FIX: Disables 20/40MHz coexistence checks in hostapd to force 40MHz width
        echo "CONFIG_DRIVER_11N_2040_COEX=n" >> .config
        
        # Include baseline interface components
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-40MHzUnlocked-v25.12.6
        path: |
          openwrt/bin/**/*.bin
