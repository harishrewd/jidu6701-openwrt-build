name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Native Board Detection Matrix (For LuCI Sync)
      run: |
        BOARD_DIR="openwrt/files/etc/board.d"
        mkdir -p "$BOARD_DIR"
        NET_FILE="$BOARD_DIR/02_network"
        
        echo '#!/bin/sh' > "$NET_FILE"
        echo '# Native early platform configuration hook' >> "$NET_FILE"
        echo 'if dmesg | grep -q "Setting dmesg designation to:"; then' >> "$NET_FILE"
        echo '    DETECTED_MODEL=$(dmesg | grep "Setting dmesg designation to:" | sed '\''s/.*designation to: //'\'')' >> "$NET_FILE"
        echo '    mkdir -p /tmp/sysinfo' >> "$NET_FILE"
        echo '    echo "$DETECTED_MODEL" > /tmp/sysinfo/model' >> "$NET_FILE"
        echo 'fi' >> "$NET_FILE"
        
        chmod +x "$NET_FILE"
        echo "✅ LuCI web dashboard configuration matrix safely generated."

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Prepare Kernel Source Tree and Inject Early dmesg Modification
      run: |
        cd openwrt
        make target/linux/prepare
        MTD_CORE_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-* -name mtdcore.c | head -n 1)
        
        if [ -n "$MTD_CORE_FILE" ] && [ -f "$MTD_CORE_FILE" ]; then
            echo "Found Kernel Storage Driver Source: $MTD_CORE_FILE"
            
            # Using absolute literal string inputs with awk to bypass shell escaping bugs entirely
            awk '
            /fail_added:/ {
                print "\tif (mtd->name && (strcmp(mtd->name, \"MFG\") == 0 || strcmp(mtd->name, \"mfg\") == 0)) {"
                print "\t\tsize_t retlen;"
                print "\t\tunsigned char *buf = kzalloc(4096, GFP_KERNEL);"
                print "\t\tif (buf) {"
                print "\t\t\tif (mtd_read(mtd, 0, 4096, &retlen, buf) == 0) {"
                print "\t\t\t\tchar *match = strnstr((char *)buf, \"device_model=\", retlen);"
                print "\t\t\t\tif (match) {"
                print "\t\t\t\t\tchar model_val[32] = {0};"
                print "\t\t\t\t\tchar final_name[64] = {0};"
                print "\t\t\t\t\tif (sscanf(match, \"device_model=%31s\", model_val) == 1) {"
                print "\t\t\t\t\t\tsnprintf(final_name, sizeof(final_name), \"JioRouter AX6000 %s\", model_val);"
                print "\t\t\t\t\t\textern void dump_stack_set_arch_desc(const char *fmt, ...);"
                print "\t\t\t\t\t\tdump_stack_set_arch_desc(\"%s\", final_name);"
                print "\t\t\t\t\t\tpr_info(\"Jio Platform Driver: Detected Hardware Variant in Flash -> Setting dmesg designation to: %s\\n\", final_name);"
                print "\t\t\t\t\t}"
                print "\t\t\t\t}"
                print "\t\t\t}"
                print "\t\t\tkfree(buf);"
                print "\t\t}"
                print "\t}"
            }
            { print }
            ' "$MTD_CORE_FILE" > "${MTD_CORE_FILE}.tmp" && mv "${MTD_CORE_FILE}.tmp" "$MTD_CORE_FILE"
            
            echo "✅ C Driver Source Code safely modified inline with proper array parameters."
        else
            echo "❌ Error: Could not locate kernel source mtdcore.c text workspace."
            exit 1
        fi

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
