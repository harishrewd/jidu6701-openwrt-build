name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Patch Native Target Platform Script Globally
      run: |
        cd openwrt
        
        # Dynamically discover the platform identification script anywhere in the source tree
        TARGET_FILE=$(find target/package/ package/ target/linux/mediatek/ -name "02_sysinfo" -o -name "01_system" -o -name "02_network" | grep -E "mediatek|filogic|base-files" | head -n 1)
        
        # If fallback lookup is needed due to specific branch mapping configurations
        [ -z "$TARGET_FILE" ] && TARGET_FILE=$(find . -name "02_sysinfo" -o -name "01_system" | head -n 1)

        if [ -n "$TARGET_FILE" ]; then
            echo "Found active platform script file at: $TARGET_FILE"
            
            # Inject a clean code block into a temporary file to completely bypass YAML parsing syntax limits
            cat << 'PATCHEOF' > patch_board.sh
#!/bin/bash
sed -i '/jiorouter,ax6000-jidu6j01)/,/;;/c\
\tjiorouter,ax6000-jidu6j01)\
\t\tlocal mfg_dev model_name\
\t\tmfg_dev=$(find_mtd_chardev "MFG")\
\t\tif [ -n "$mfg_dev" ]; then\
\t\t\tmodel_name=$(dd if="$mfg_dev" bs=1k count=256 2>/dev/null | strings | grep -m 1 "device_model=" | cut -d'\''='\'' -f2 | tr -d '\''[:space:]'\'')\
\t\tfi\
\t\tcase "$model_name" in\
\t\t\tJIDU6201) ucidef_set_model_name "JioRouter AX6000 JIDU6201" ;;\
\t\t\tJIDU6401) ucidef_set_model_name "JioRouter AX6000 JIDU6401" ;;\
\t\t\tJIDU6701) ucidef_set_model_name "JioRouter AX6000 JIDU6701" ;;\
\t\t\tJIDU6801) ucidef_set_model_name "JioRouter AX6000 JIDU6801" ;;\
\t\t\t*) ucidef_set_model_name "JioRouter AX6000 JIDU6J01" ;;\
\t\tesac\
\t\t;;' "$1"
PATCHEOF

            chmod +x patch_board.sh
            ./patch_board.sh "$TARGET_FILE"
            echo "✅ Successfully updated target architecture mapping block."
            grep -A 15 "jiorouter,ax6000-jidu6j01)" "$TARGET_FILE" || true
        else
            echo "⚠️ Notice: Global patch container skipped. Reverting to unified target subsystem execution."
        fi

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        # Select official architecture targets for Mediatek Filogic / JioRouter
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        # Include baseline user interface components
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-DynamicCore-v25.12.6
        path: |
          openwrt/bin/**/*.bin
