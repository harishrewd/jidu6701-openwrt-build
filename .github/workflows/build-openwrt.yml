name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Prepare Kernel Source Tree and Inject Early dmesg Modification
      run: |
        cd openwrt
        
        # 1. Force OpenWrt to extract the kernel source and apply all its standard patches first
        make target/linux/prepare
        
        # 2. Find the extracted mtdcore.c inside the active build directories
        MTD_CORE_FILE=$(find build_dir/target-*/linux-mediatek_filogic/linux-* -name mtdcore.c | head -n 1)
        
        if [ -n "$MTD_CORE_FILE" ] && [ -f "$MTD_CORE_FILE" ]; then
            echo "Found Kernel Storage Driver Source: $MTD_CORE_FILE"
            
            # Create our driver hook block as a single string variable
            HOOK_CODE='if (mtd->name && (strcmp(mtd->name, "MFG") == 0 || strcmp(mtd->name, "mfg") == 0)) {\
                size_t retlen;\
                unsigned char *buf = kzalloc(4096, GFP_KERNEL);\
                if (buf) {\
                    if (mtd_read(mtd, 0, 4096, &retlen, buf) == 0) {\
                        char *match = strnstr((char *)buf, "device_model=", retlen);\
                        if (match) {\
                            char model_val[32] = {0};\
                            char final_name[64] = {0};\
                            if (sscanf(match, "device_model=%31s", model_val) == 1) {\
                                snprintf(final_name, sizeof(final_name), "JioRouter AX6000 %s", model_val);\
                                extern void dump_stack_set_arch_desc(const char *fmt, ...);\
                                dump_stack_set_arch_desc("%s", final_name);\
                                pr_info("Jio Platform Driver: Detected Hardware Variant in Flash -> Setting dmesg designation to: %s\\n", final_name);\
                            }\
                        }\
                    }\
                    kfree(buf);\
                }\
            }'
            
            # Inject our hook natively directly inside the "add_mtd_device" function right above "return 0;"
            sed -i "/fail_added:/i $HOOK_CODE" "$MTD_CORE_FILE"
            echo "✅ C Driver Source Code safely modified inline for true dmesg identification."
        else
            echo "❌ Error: Could not locate kernel source mtdcore.c text workspace."
            exit 1
        fi

    - name: Inject Native Board Detection Matrix (For LuCI Sync)
      run: |
        BOARD_DIR="openwrt/files/etc/board.d"
        mkdir -p "$BOARD_DIR"
        NET_FILE="$BOARD_DIR/02_network"
        
        # Reads the dynamic string from the flash block to sync LuCI cleanly on startup
        echo '#!/bin/sh' > "$NET_FILE"
        echo '# Native early platform configuration hook' >> "$NET_FILE"
        echo 'if [ -c "/dev/mtd6" ]; then' >> "$NET_FILE"
        echo '    DETECTED_MODEL=$(dd if=/dev/mtd6 bs=1k count=256 2>/dev/null | strings | grep -m 1 "device_model=" | cut -d'=' -f2 | tr -d '\''[:space:]'\'')' >> "$NET_FILE"
        echo '    if [ -n "$DETECTED_MODEL" ]; then' >> "$NET_FILE"
        echo '        mkdir -p /tmp/sysinfo' >> "$NET_FILE"
        echo '        echo "JioRouter AX6000 $DETECTED_MODEL" > /tmp/sysinfo/model' >> "$NET_FILE"
        echo '    fi' >> "$NET_FILE"
        echo 'fi' >> "$NET_FILE"
        
        chmod +x "$NET_FILE"
        echo "✅ LuCI dashboard mapping script generated seamlessly."

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        # Compiles the pre-patched kernel directly into final firmware files
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
