name: Build OpenWrt for JioRouter JIDU6701 (25.12.6+)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
        sudo apt-get update
        sudo apt-get -y install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget time
        sudo apt-get clean

    - name: Clone Source Code
      run: |
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Runtime Model Detection Override (Force JIDU6701)
      run: |
        cd openwrt
        # Create a custom directory structure to inject runtime network profiles
        mkdir -p files/etc/init.d
        mkdir -p files/etc/uci-defaults
        
        # Create an auto-run hook script that runs on the first boot to force the model identification string
        cat << 'EOF' > files/etc/uci-defaults/99-force-jidu6701
        #!/bin/sh
        # Force system identification arrays to map specifically to your target router hardware model
        uci set system.@system[0].hostname='JIDU6701'
        uci set system.@system[0].model='JioRouter AX6000 JIDU6701'
        uci commit system
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-force-jidu6701

    - name: Generate Custom Build Configuration (.config)
      run: |
        cd openwrt
        # Define core targets exactly how the build architecture expects them to keep compilation clean
        echo "CONFIG_TARGET_mediatek=y" > .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000=y" >> .config
        
        # Expand core selections to populate dependency trees properly
        make defconfig
        
        # Force enable standard packages and UI applications safely after tree expansion
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        # Finalize structural validation
        make defconfig

    - name: Compile the Firmware
      run: |
        cd openwrt
        echo "Starting safe-mode toolchain compilation..."
        # Build host tools safely using single-threading to eliminate deadlock container freezes
        FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s || FORCE_UNSAFE_CONFIGURE=1 make tools/compile -j1 V=s
        # Build the toolchain using full system power
        FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make toolchain/compile -j1 V=s
        # Compile all packages and target firmware images using maximum threads
        FORCE_UNSAFE_CONFIGURE=1 make -j$(nproc) V=s || FORCE_UNSAFE_CONFIGURE=1 make -j1 V=s

    - name: Upload Firmware to GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt_25.12.6_JIDU6701_Firmware
        path: openwrt/bin/**/*.bin
