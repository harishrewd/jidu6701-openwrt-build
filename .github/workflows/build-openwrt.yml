name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Early dmesg Flash Detection Patch
      run: |
        TARGET_PATCH_DIR="openwrt/target/linux/mediatek/patches-6.12"
        mkdir -p "$TARGET_PATCH_DIR"
        
        cat << 'EOF' > "$TARGET_PATCH_DIR/999-jio-mfg-dmesg-override.patch"
--- a/drivers/mtd/mtdcore.c
+++ b/drivers/mtd/mtdcore.c
@@ -31,6 +31,7 @@
 #include <linux/reboot.h>
 #include <linux/leds.h>
 #include <linux/debugfs.h>
+#include <linux/string.h>
 
 #include <linux/mtd/mtd.h>
 #include <linux/mtd/partitions.h>
@@ -945,6 +946,28 @@ int add_mtd_device(struct mtd_info *mtd)
 	if (mtd->dev.parent)
 		device_link_add(&mtd->dev, mtd->dev.parent, DL_FLAG_STATELESS);
 
+	if (strcmp(mtd->name, "MFG") == 0 || strcmp(mtd->name, "mfg") == 0) {
+		size_t retlen;
+		unsigned char *buf = kmalloc(4096, GFP_KERNEL);
+		if (buf) {
+			if (mtd_read(mtd, 0, 4096, &retlen, buf) == 0) {
+				buf[retlen - 1] = '\0';
+				char *match = strnstr((char *)buf, "device_model=", retlen);
+				if (match) {
+					char model_val[32] = {0};
+					char final_name[64] = {0};
+					if (sscanf(match, "device_model=%31s", model_val) == 1) {
+						snprintf(final_name, sizeof(final_name), "JioRouter AX6000 %s", model_val);
+						extern void dump_stack_set_arch_desc(const char *fmt, ...);
+						dump_stack_set_arch_desc("%s", final_name);
+						pr_info("Jio Platform Driver: Detected Hardware Variant in Flash -> Setting dmesg designation to: %s\n", final_name);
+					}
+				}
+			}
+			kfree(buf);
+		}
+	}
+
 	return 0;
 
 fail_added:
EOF
        echo "✅ Early-boot dmesg storage patch cleanly injected into kernel tree."

    - name: Inject Native Board Detection Matrix (For LuCI Sync)
      run: |
        BOARD_DIR="openwrt/files/etc/board.d"
        mkdir -p "$BOARD_DIR"
        
        cat << 'EOF' > "$BOARD_DIR/02_network"
#!/bin/sh
# Native early platform configuration hook

if dmesg | grep -q "Setting dmesg designation to:"; then
    DETECTED_MODEL=$(dmesg | grep "Setting dmesg designation to:" | sed 's/.*designation to: //')
    mkdir -p /tmp/sysinfo
    echo "$DETECTED_MODEL" > /tmp/sysinfo/model
fi
EOF
        
        chmod +x "$BOARD_DIR/02_network"
        echo "✅ LuCI web dashboard sync integrated directly into native early platform initialization."

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
