name: Compile Clean Jio JIDU Auto-Detect Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Custom Model Auto-Detection via Files Overlay
      run: |
        # Use OpenWrt's native files overlay to deposit a clean first-boot configuration hook
        # This keeps the underlying source tree completely stock and clean
        OVERLAY_DIR="openwrt/files/etc/uci-defaults"
        mkdir -p "$OVERLAY_DIR"
        DEFAULTS_SCRIPT="$OVERLAY_DIR/99-jio-model-detect"
        
        cat << 'EOF' > "$DEFAULTS_SCRIPT"
        #!/bin/sh
        
        local raw_model=""
        local final_name="JioRouter AX6000 JIDU6J01"

        # Safe read-only identification scan directly from the factory MFG partition
        if [ -c "/dev/mtd6" ]; then
            raw_model=$(dd if="/dev/mtd6" bs=1k count=256 2>/dev/null | strings | grep -m 1 "device_model=" | cut -d'=' -f2 | tr -d '[:space:]')
        fi

        case "$raw_model" in
            JIDU6201) final_name="JioRouter AX6000 JIDU6201" ;;
            JIDU6401) final_name="JioRouter AX6000 JIDU6401" ;;
            JIDU6701) final_name="JioRouter AX6000 JIDU6701" ;;
            JIDU6801) final_name="JioRouter AX6000 JIDU6801" ;;
            *) 
                if [ -n "$raw_model" ]; then
                    final_name="JioRouter AX6000 $raw_model"
                fi
                ;;
        esac

        # Set the volatile memory tag immediately for the first-boot rendering
        mkdir -p /tmp/sysinfo
        echo "$final_name" > /tmp/sysinfo/model
        
        # Commit the true model configuration permanently into the system parameters database
        uci set system.@system[0].model="$final_name"
        uci commit system
        
        exit 0
        EOF
        
        chmod +x "$DEFAULTS_SCRIPT"
        echo "✅ First-boot uci-defaults override configuration script generated in files/ overlay."

    - name: Configure Target Matrix (True JIDU Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        # Select official architecture targets for Mediatek Filogic / JioRouter
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        # Include baseline user interface web interface components
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU-OpenWrt-AutoDetect-StockRadio-v25.12.6
        path: |
          openwrt/bin/**/*.bin
