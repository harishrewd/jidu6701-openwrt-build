name: Compile Clean Jio JIDU 6701 Stock-Style Firmware (v25.12.6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
        file wget zstd libz3-dev

    - name: Clone OpenWrt v25.12.6 Source
      run: |
        git clone -b v25.12.6 https://github.com/openwrt/openwrt.git
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Permanent JIDU 6701 Model Name
      run: |
        TARGET_FILE="openwrt/target/linux/mediatek/image/filogic.mk"
        BOARD_SCRIPT="openwrt/target/linux/mediatek/filogic/base-files/etc/board.d/01_system"
        DTS_FILE="openwrt/target/linux/mediatek/dts/mt7986a-jiorouter-jidu6j01.dts"
        
        # 1. Update compilation metadata layout branding
        if [ -f "$TARGET_FILE" ]; then
          sed -i 's/DEVICE_MODEL := JioRouter AX6000 JIDU6J01/DEVICE_MODEL := JioRouter AX6000 JIDU6701/g' "$TARGET_FILE"
          echo "✅ Device metadata patched successfully."
        fi
        
        # 2. Update internal system fallback identification script
        if [ -f "$BOARD_SCRIPT" ]; then
          sed -i 's/JioRouter AX6000 JIDU6J01/JioRouter AX6000 JIDU6701/g' "$BOARD_SCRIPT"
          echo "✅ Board initialization string updated successfully."
        fi
        
        # 3. CRITICAL DEVICE TREE FIX: Force the built kernel block to identify natively as 6701
        if [ -f "$DTS_FILE" ]; then
          sed -i 's/model = "JioRouter AX6000 JIDU6J01";/model = "JioRouter AX6000 JIDU6701";/g' "$DTS_FILE"
          echo "✅ Device Tree hardware model string patched successfully."
        fi

    - name: Configure Target Matrix (True JIDU 6701 Firmware Selection)
      run: |
        cd openwrt
        rm -f .config
        
        # Core Architecture Target Configuration for JioRouter
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jiorouter_ax6000-jidu6j01=y" >> .config
        
        # Profile assignments mapping block
        echo "CONFIG_HAS_SUBTARGETS=y" >> .config
        echo "CONFIG_TARGET_BOARD=\"mediatek\"" >> .config
        echo "CONFIG_TARGET_SUBTARGET=\"filogic\"" >> .config
        echo "CONFIG_TARGET_PROFILE=\"DEVICE_jiorouter_ax6000-jidu6j01\"" >> .config
        
        # CRITICAL 40MHz FIX: Disables 20/40MHz coexistence checks in hostapd to force 40MHz width
        echo "CONFIG_DRIVER_11N_2040_COEX=n" >> .config
        
        # Include baseline interface components
        echo "CONFIG_PACKAGE_dnsmasq=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
        
        make defconfig

    - name: Compile Toolchain and Custom Firmware
      run: |
        cd openwrt
        export FORCE_UNSAFE_CONFIGURE=1
        make -j$(nproc) || make -j1 V=s

    - name: Upload Verified Jio Jidu 6701 Custom Firmware
      uses: actions/upload-artifact@v4
      with:
        name: JIDU6701-OpenWrt-v25.12.6-TrueARMv8-Unbound-1.26.1
        path: |
          openwrt/bin/**/*.bin
